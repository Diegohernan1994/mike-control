name: Verify backend and Docker
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mike_test
          POSTGRES_PASSWORD: isolated-ci-database-password
          POSTGRES_DB: mike_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mike_test -d mike_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://mike_test:isolated-ci-database-password@127.0.0.1:5432/mike_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: Check dependency consistency
        run: pip check
      - name: Test API and real PostgreSQL
        run: python -m pytest -q
      - name: Check JavaScript
        run: node --check web/app.js
      - name: Build Docker image
        run: docker build --tag mike-control:verify .
      - name: Test packaged image and restart persistence
        run: python tests/docker_smoke.py
